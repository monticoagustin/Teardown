name: Publicar en teskel.online/teardown

# En cada push a main, copia la galería y los modelos a la carpeta teardown/
# del repo del Space "teskel" en Spacefast. Spacefast publica teskel solo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-en-teskel
  cancel-in-progress: false

env:
  TESKEL_SPACE_ID: spc_02ae51f4db5a45b3a6c013388fe16504
  CARPETA_DESTINO: teardown

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo Teardown
        uses: actions/checkout@v4
        with:
          path: teardown-src

      - name: Validar modelos.json, carpetas y portadas
        working-directory: teardown-src
        run: |
          python3 - <<'EOF'
          import json, os, sys
          modelos = json.load(open("modelos.json"))
          errores = []
          for m in modelos:
              if not os.path.isfile(f"{m['id']}/index.html"):
                  errores.append(f"Falta {m['id']}/index.html")
              if not os.path.isfile(m["portada"]):
                  errores.append(f"Falta {m['portada']}")
          if errores:
              print("\n".join(errores)); sys.exit(1)
          print(f"OK: {len(modelos)} modelos")
          EOF

      - name: Pedir un remoto de push temporal para teskel
        env:
          SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_TOKEN }}
        run: |
          if [ -z "$SPACEFAST_TOKEN" ]; then
            echo "::error::Falta el secreto SPACEFAST_TOKEN en Settings → Secrets → Actions."; exit 1
          fi
          respuesta=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.spacefast.com/v1/spaces/${TESKEL_SPACE_ID}/source/push-remote" \
            -H "Authorization: Bearer ${SPACEFAST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ttlSeconds": 900}')
          codigo=$(echo "$respuesta" | tail -n1)
          cuerpo=$(echo "$respuesta" | sed '$d')
          if [ "$codigo" -ge 300 ]; then
            echo "::error::Spacefast respondió $codigo al pedir el remoto: $(echo "$cuerpo" | jq -r '.code // .title // .')"
            exit 1
          fi
          url=$(echo "$cuerpo" | jq -r '[.. | objects | .pushUrl? // empty][0]')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::La respuesta de Spacefast no trae pushUrl."; exit 1
          fi
          echo "::add-mask::$url"
          echo "TESKEL_REMOTE=$url" >> "$GITHUB_ENV"

      - name: Clonar teskel
        run: git clone --quiet --depth 1 --branch main "$TESKEL_REMOTE" teskel

      - name: Copiar Teardown a teskel/teardown
        run: |
          mkdir -p "teskel/${CARPETA_DESTINO}"
          rsync -a --delete \
            --exclude '.git/' --exclude '.github/' \
            --exclude 'README.md' --exclude '.gitignore' \
            teardown-src/ "teskel/${CARPETA_DESTINO}/"

      - name: Commit y push a teskel
        working-directory: teskel
        env:
          MENSAJE_ORIGEN: ${{ github.event.head_commit.message }}
        run: |
          git add -A "${CARPETA_DESTINO}"
          if git diff --cached --quiet; then
            echo "Sin cambios en ${CARPETA_DESTINO}/; no hay nada que publicar."; exit 0
          fi
          git -c user.name="Teardown (GitHub Actions)" \
              -c user.email="actions@users.noreply.github.com" \
              commit -q -m "teardown: sincronizar desde monticoagustin/Teardown@${GITHUB_SHA::7}" \
                        -m "${MENSAJE_ORIGEN:-Ejecución manual}"
          git push --quiet origin HEAD:main
          echo "Publicado: https://teskel.online/${CARPETA_DESTINO}/"
